<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF" />
      <stop offset="100%" stop-color="#1E6FD9" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#12A89D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark tile background -->
  <rect width="100" height="100" rx="22" fill="#0B1220" />
  
  <!-- Left person (Blue) forming circular arc -->
  <circle cx="34" cy="27" r="7" fill="url(#blueGrad)" />
  <path d="M 34 37 C 22 45, 20 65, 33 77 C 40 84, 52 86, 60 82 C 48 83, 30 76, 28 60 C 26 50, 31 43, 34 37 Z" fill="url(#blueGrad)" />

  <!-- Right person (Teal) completing circular arc -->
  <circle cx="66" cy="27" r="7" fill="url(#tealGrad)" />
  <path d="M 66 37 C 78 45, 80 65, 67 77 C 60 84, 48 86, 40 82 C 52 83, 70 76, 72 60 C 74 50, 69 43, 66 37 Z" fill="url(#tealGrad)" />

  <!-- Central Chat Bubble -->
  <path d="M 40 46 C 40 40, 60 40, 60 46 C 60 52, 53 55, 47 55 L 43 59 L 44 55 C 41 55, 40 52, 40 46 Z" fill="#F4F8FC" />
  <!-- Three dots in chat bubble -->
  <circle cx="46" cy="46" r="1.5" fill="#0B3A7A" />
  <circle cx="50" cy="46" r="1.5" fill="#0B3A7A" />
  <circle cx="54" cy="46" r="1.5" fill="#0B3A7A" />

  <!-- Signing hand gesture silhouette -->
  <path d="M 45 64 C 47 62, 51 62, 53 64 C 55 66, 54 69, 51 71 C 48 72, 45 70, 45 67 Z" fill="#2DD4BF" opacity="0.95" />
  <circle cx="48" cy="65" r="1.5" fill="#0B1220" />

  <!-- Plus (+) Glowing Badge at the top center -->
  <circle cx="50" cy="22" r="8.5" fill="#0B1220" stroke="#00F0FF" stroke-width="1.8" filter="url(#glow)" />
  <path d="M 50 17 L 50 27 M 45 22 L 55 22" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" />
</svg>
